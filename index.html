<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Табак-міксер</title>
  <meta name="description" content="Швидко обрати мікс табаку для кальяну">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Табак">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Табак-міксер</h1>
  </header>

  <main>
    <!-- Мікс -->
    <section id="tab-mix" class="tab active" aria-label="Мікс">
      <div id="rate-last"></div>

      <h2 class="section-title">Настрій</h2>
      <div id="moods" class="chips"></div>

      <button id="btn-mix" class="btn btn-primary btn-big">🎲 Обрати мікс</button>

      <div id="mix-result"></div>
    </section>

    <!-- Колекція -->
    <section id="tab-collection" class="tab" aria-label="Колекція">
      <div class="row">
        <input id="search" class="input" type="search" placeholder="Пошук табаку…" autocomplete="off">
        <button id="btn-add" class="btn btn-primary">+ Додати</button>
      </div>
      <div class="chips chips-small" id="stock-filter"></div>
      <div id="collection-list"></div>

      <details class="backup">
        <summary>Бекап даних</summary>
        <p class="muted">Дані зберігаються тільки на цьому телефоні. Зроби бекап, щоб не загубити колекцію та історію.</p>
        <div class="row">
          <button id="btn-export" class="btn">Зберегти файл</button>
          <label class="btn">Відновити з файлу<input id="file-import" type="file" accept="application/json,.json" hidden></label>
        </div>
      </details>
    </section>

    <!-- Історія -->
    <section id="tab-history" class="tab" aria-label="Історія">
      <div class="chips chips-small" id="history-filter"></div>
      <div id="history-list"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="mix" class="active"><span>🎲</span>Мікс</button>
    <button data-tab="collection"><span>📦</span>Колекція</button>
    <button data-tab="history"><span>🕓</span>Історія</button>
  </nav>

  <dialog id="tobacco-dialog">
    <form id="tobacco-form" method="dialog">
      <h2 id="dialog-title">Новий табак</h2>
      <label class="field">Смак *
        <input class="input" name="name" required maxlength="60" placeholder="Напр. Полуниця з лаймом">
      </label>
      <label class="field">Бренд
        <input class="input" name="brand" maxlength="40" placeholder="Напр. Darkside">
      </label>
      <div class="field">Категорії смаку * <span class="muted">(1–3)</span>
        <div id="tag-picker" class="chips chips-small"></div>
      </div>
      <label class="field">Міцність
        <select class="input" name="strength" id="strength-select"></select>
      </label>
      <label class="check"><input type="checkbox" name="inStock" checked> Є вдома</label>
      <p id="form-error" class="error" hidden></p>
      <div class="row row-end">
        <button type="button" class="btn" id="btn-cancel">Скасувати</button>
        <button type="submit" class="btn btn-primary">Зберегти</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
