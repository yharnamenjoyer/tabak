<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Табак-міксер</title>
  <meta name="description" content="Швидко обрати мікс табаку для кальяну">
  <meta name="theme-color" content="#14110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Табак">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Табак-міксер</h1>
  </header>

  <main>
    <!-- Мікс -->
    <section id="tab-mix" class="tab active" aria-label="Мікс">
      <div id="rate-last"></div>

      <h2 class="section-title">З чого обирати</h2>
      <div id="sources" class="chips"></div>

      <h2 class="section-title">Настрій</h2>
      <div id="moods" class="chips"></div>

      <button id="btn-mix" class="btn btn-primary btn-big">🎲 Обрати мікс</button>

      <div id="mix-result"></div>
    </section>

    <!-- Каталог -->
    <section id="tab-catalog" class="tab" aria-label="Каталог">
      <input id="search" class="input" type="search" placeholder="Пошук: назва або смак…" autocomplete="off">
      <div class="chips chips-small" id="brand-filter"></div>
      <div class="chips chips-small" id="catalog-filter"></div>
      <div id="catalog-list"></div>

      <p id="catalog-info" class="muted small"></p>
      <details class="backup">
        <summary>Бекап моїх даних</summary>
        <p class="muted">Оцінки, коментарі, «є вдома» та історія зберігаються тільки на цьому телефоні. Зроби бекап, щоб не загубити їх.</p>
        <div class="row">
          <button id="btn-export" class="btn">Зберегти файл</button>
          <label class="btn">Відновити з файлу<input id="file-import" type="file" accept="application/json,.json" hidden></label>
        </div>
      </details>
    </section>

    <!-- Топ -->
    <section id="tab-top" class="tab" aria-label="Топ">
      <div id="top-content"></div>
    </section>

    <!-- Історія -->
    <section id="tab-history" class="tab" aria-label="Історія">
      <div class="chips chips-small" id="history-filter"></div>
      <div id="history-list"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="mix" class="active"><span>🎲</span>Мікс</button>
    <button data-tab="catalog"><span>📦</span>Каталог</button>
    <button data-tab="top"><span>🏆</span>Топ</button>
    <button data-tab="history"><span>🕓</span>Історія</button>
  </nav>

  <!-- Картка табаку -->
  <dialog id="tobacco-dialog">
    <form id="tobacco-form" method="dialog">
      <div class="detail-head">
        <img id="d-img" alt="" width="88" height="88" loading="lazy" hidden>
        <div class="detail-title">
          <div id="d-brand" class="muted"></div>
          <h2 id="d-name"></h2>
          <div id="d-flavor"></div>
        </div>
      </div>
      <div id="d-tags" class="d-tags muted"></div>
      <div id="d-stats" class="stats"></div>
      <div id="d-shop" class="shop-row"></div>

      <div class="field">Моя оцінка
        <div id="d-stars" class="stars stars-big" role="radiogroup" aria-label="Оцінка"></div>
        <div id="d-stars-hint" class="muted small"></div>
      </div>
      <label class="field">Мій коментар
        <textarea class="input" name="comment" rows="3" maxlength="500" placeholder="Напр. добре з м'ятою, міцнуватий…"></textarea>
      </label>
      <label class="check"><input type="checkbox" name="home"> 🏠 Є вдома</label>
      <div class="row row-end">
        <button type="button" class="btn" id="btn-cancel">Закрити</button>
        <button type="submit" class="btn btn-primary">Зберегти</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
